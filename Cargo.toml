[package]
name = "barkeep"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MCP-native command palette for Linux"

[dependencies]
iced = { version = "0.14", features = ["tokio", "wgpu"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
nucleo-matcher = "0.3"
freedesktop-desktop-entry = "0.8"
global-hotkey = "0.6"
dirs = "6"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
